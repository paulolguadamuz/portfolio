<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/P.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#0A0A0B" />

  <title>Paulo Jimenez Guadamuz — Portfolio</title>
  <meta name="description"
    content="Portfolio de Paulo Jimenez Guadamuz — Ingeniero TI, Desarrollador Web, UI/UX Designer. Proyectos web creativos y experiencias digitales de alto nivel." />
  <link rel="canonical" href="https://www.paulojimenez.blog/" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.paulojimenez.blog/" />
  <meta property="og:site_name" content="Paulo Jimenez Guadamuz" />
  <meta property="og:title" content="Paulo Jimenez Guadamuz — IT Engineer & Web Developer" />
  <meta property="og:description"
    content="IT Engineer, Web Developer and UI/UX Designer. Selected work: Novasite, Bougainvillea, MantenTools and Mea Culpa." />
  <meta property="og:image" content="https://www.paulojimenez.blog/og-cover.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:image:alt" content="Paulo Jimenez Guadamuz — Portfolio" />
  <meta property="og:locale" content="en_US" />
  <meta property="og:locale:alternate" content="es_ES" />

  <!-- Twitter / X -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Paulo Jimenez Guadamuz — IT Engineer & Web Developer" />
  <meta name="twitter:description"
    content="IT Engineer, Web Developer and UI/UX Designer. Selected work: Novasite, Bougainvillea, MantenTools and Mea Culpa." />
  <meta name="twitter:image" content="https://www.paulojimenez.blog/og-cover.png" />

  <!-- Fonts: preconnect + direct link so the download starts in parallel with the CSS,
       instead of being discovered by an @import inside index.css -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=Space+Grotesk:wght@300;400;500;600;700&family=Allura&display=swap" />
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
